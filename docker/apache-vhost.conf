<VirtualHost *:80>
    ServerName laporkupva.ikydev.com
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    ProxyPreserveHost On
    ProxyPass /app ws://reverb:8080/app retry=0 timeout=60
    ProxyPassReverse /app ws://reverb:8080/app
    ProxyPass /apps http://reverb:8080/apps retry=0 timeout=60
    ProxyPassReverse /apps http://reverb:8080/apps

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "^\.ht">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), payment=(), usb=()"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
