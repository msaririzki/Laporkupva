name: laporkupva

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: laporkupva-app:latest
    container_name: laporkupva-web
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    mem_reservation: 96m
    memswap_limit: 768m
    pids_limit: 256
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8014:80"
    volumes:
      - laporkupva-data:/var/lib/laporkupva
      - laporkupva-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  laporkupva-data:
  laporkupva-storage:
